app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration: ${JWT_EXPIRATION:86400000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  superadmin:
    email: ${SUPERADMIN_EMAIL:superadmin@healthcare.com}
    password: ${SUPERADMIN_PASSWORD:SuperAdmin123!}
    firstName: ${SUPERADMIN_FIRST_NAME:Super}
    lastName: ${SUPERADMIN_LAST_NAME:Administrator}

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  application:
    name: mths-backend
  liquibase:
    enabled: false
    change-log: classpath:db/changelog/db.changelog-master.xml
    test-rollback-on-update: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mthsdb}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:mechack200}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
        debug: ${MAIL_DEBUG:false}

server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /
  error:
    include-stacktrace: on_param
    include-message: always

# Frontend Configuration
frontend:
  allowed-origins: ${FRONTEND_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200}
  base-url: ${FRONTEND_BASE_URL:http://localhost:3000}

# File Upload Configuration
file:
  upload:
    max-size: ${MAX_FILE_SIZE:10MB}
    allowed-types: ${ALLOWED_FILE_TYPES:image/jpeg,image/png,image/gif,application/pdf}

minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  buckets:
    profile-image: profile-images
    user-document: patient-documents
    medical-report: medical-reports
    prescription: prescriptions

# Logging configuration for better debugging
logging:
  level:
    com.mths: ${LOG_LEVEL:INFO}
    org.springframework.security: ${SECURITY_LOG_LEVEL:DEBUG}
    org.springframework.web.cors: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
