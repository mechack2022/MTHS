name: MTHS Backend CI/CD

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: mths_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Cache Maven packages
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Set up environment variables
      run: |
        echo "DB_URL=jdbc:postgresql://localhost:5432/mths_test" >> $GITHUB_ENV
        echo "DB_USER=postgres" >> $GITHUB_ENV
        echo "DB_PASSWORD=postgres" >> $GITHUB_ENV
        echo "JWT_EXPIRATION=86400000" >> $GITHUB_ENV
        echo "JWT_REFRESH_EXPIRATION=604800000" >> $GITHUB_ENV
        echo "MAIL_HOST=localhost" >> $GITHUB_ENV
        echo "MAIL_PORT=1025" >> $GITHUB_ENV
        echo "MINIO_ENDPOINT=http://localhost:9000" >> $GITHUB_ENV
        echo "SERVER_PORT=8081" >> $GITHUB_ENV
        echo "LOG_LEVEL=INFO" >> $GITHUB_ENV
        echo "SECURITY_LOG_LEVEL=INFO" >> $GITHUB_ENV
        echo "CONSULTATION_FEE=10000.00" >> $GITHUB_ENV
        echo "PAYMENT_CURRENCY=NGN" >> $GITHUB_ENV

    - name: Set up secrets from GitHub Secrets
      env:
        JWT_SECRET: ${{ secrets.JWT_SECRET }}
        SUPERADMIN_PASSWORD: ${{ secrets.SUPERADMIN_PASSWORD }}
        SUPERADMIN_EMAIL: ${{ secrets.SUPERADMIN_EMAIL }}
        MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
        MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
        PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
        PAYSTACK_PUBLIC_KEY: ${{ secrets.PAYSTACK_PUBLIC_KEY }}
        PAYSTACK_WEBHOOK_SECRET: ${{ secrets.PAYSTACK_WEBHOOK_SECRET }}
      run: |
        echo "JWT_SECRET=$JWT_SECRET" >> $GITHUB_ENV
        echo "SUPERADMIN_PASSWORD=$SUPERADMIN_PASSWORD" >> $GITHUB_ENV
        echo "SUPERADMIN_EMAIL=${SUPERADMIN_EMAIL:-superadmin@healthcare.com}" >> $GITHUB_ENV
        echo "MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}" >> $GITHUB_ENV
        echo "MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}" >> $GITHUB_ENV
        echo "PAYSTACK_SECRET_KEY=${PAYSTACK_SECRET_KEY:-sk_test_dummy}" >> $GITHUB_ENV
        echo "PAYSTACK_PUBLIC_KEY=${PAYSTACK_PUBLIC_KEY:-pk_test_dummy}" >> $GITHUB_ENV
        echo "PAYSTACK_WEBHOOK_SECRET=${PAYSTACK_WEBHOOK_SECRET:-webhook_dummy}" >> $GITHUB_ENV

    - name: Build with Maven
      run: mvn -B clean compile --file backend/pom.xml

    - name: Run tests
      run: mvn test --file backend/pom.xml

    - name: Package application
      run: mvn -B package -DskipTests --file backend/pom.xml

    - name: Upload JAR artifact
      uses: actions/upload-artifact@v3
      with:
        name: mths-backend-jar
        path: backend/target/*.jar
        retention-days: 7

    - name: Build summary
      if: success()
      run: |
        echo "### ✅ Build Successful!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "**Author:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "JAR file has been packaged and uploaded as an artifact." >> $GITHUB_STEP_SUMMARY

    - name: Failure summary
      if: failure()
      run: |
        echo "### ❌ Build Failed!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Please check the logs above for details." >> $GITHUB_STEP_SUMMARY
